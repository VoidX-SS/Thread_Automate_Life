name: Test and preview content (v3)
on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "config/**"
      - "data/seed_bank.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "*.py"
      - "config/**"
      - "data/seed_bank.json"
      - ".github/workflows/test.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - name: Offline smoke preview
        run: python thread_life_bot.py --offline
      - name: Preview with workhorse model on main (saves Flagship 20/day quota)
        if: github.event_name == 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FLAGSHIP_MODEL: ${{ vars.GEMINI_FLAGSHIP_MODEL || 'gemini-4-hydrogen' }}
          GEMINI_WORKHORSE_MODEL: ${{ vars.GEMINI_WORKHORSE_MODEL || vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          ALLOW_FLAGSHIP_IN_DRY_RUN: "false"
          DRY_RUN: "true"
          CONTENT_DEBUG: "true"
          ENABLE_TREND_FEED: "false"
          ENABLE_THREADS_TRENDS: "false"
        run: python thread_life_bot.py --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composer-preview-${{ github.run_id }}
          path: data/last_run.json
          if-no-files-found: ignore
          retention-days: 14
