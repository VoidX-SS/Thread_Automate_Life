name: Threads Psychology & Philosophy Bot (v3.2)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: "auto"
        type: choice
        options: [auto, post, reply, insights]
      live:
        description: "Publish live; false always forces a preview"
        required: true
        default: false
        type: boolean
  repository_dispatch:
    types: [run-bot]

permissions:
  contents: write

concurrency:
  group: threads-life-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FLAGSHIP_MODEL: ${{ vars.GEMINI_FLAGSHIP_MODEL || 'gemini-4-hydrogen' }}
      GEMINI_WORKHORSE_MODEL: ${{ vars.GEMINI_WORKHORSE_MODEL || vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      FLAGSHIP_MAX_RETRIES: ${{ vars.FLAGSHIP_MAX_RETRIES || '2' }}
      FLAGSHIP_DAILY_CAP: ${{ vars.FLAGSHIP_DAILY_CAP || '20' }}
      FLAGSHIP_LIVE_RESERVE: ${{ vars.FLAGSHIP_LIVE_RESERVE || '6' }}
      ALLOW_FLAGSHIP_IN_DRY_RUN: ${{ vars.ALLOW_FLAGSHIP_IN_DRY_RUN || 'true' }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      ENABLE_REPLIES: ${{ vars.ENABLE_REPLIES || 'false' }}
      REPLY_DAILY_CAP: ${{ vars.REPLY_DAILY_CAP || '6' }}
      POST_DAILY_CAP: ${{ vars.POST_DAILY_CAP || '5' }}
      POST_MIN_INTERVAL_MINUTES: ${{ vars.POST_MIN_INTERVAL_MINUTES || '60' }}
      CHAIN_DELAY_SECONDS: ${{ vars.CHAIN_DELAY_SECONDS || '8' }}
      TOPIC_SEED: ${{ vars.TOPIC_SEED || '' }}
      TREND_HINT: ${{ vars.TREND_HINT || '' }}
      ENABLE_TREND_FEED: ${{ vars.ENABLE_TREND_FEED || 'false' }}
      ENABLE_THREADS_TRENDS: ${{ vars.ENABLE_THREADS_TRENDS || 'false' }}
      ENABLE_INSIGHTS: ${{ vars.ENABLE_INSIGHTS || 'true' }}
      CONTENT_DEBUG: ${{ vars.CONTENT_DEBUG || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve run mode and live flag
        id: settings
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LIVE: ${{ inputs.live }}
          DISPATCH_MODE: ${{ github.event.client_payload.mode }}
          DISPATCH_LIVE: ${{ github.event.client_payload.live }}
        run: |
          MODE=auto
          LIVE=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="${INPUT_MODE:-auto}"
            if [ "$INPUT_LIVE" = "true" ]; then LIVE=true; else LIVE=false; fi
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            MODE="${DISPATCH_MODE:-auto}"
            if [ "$DISPATCH_LIVE" = "true" ]; then
              LIVE=true
            elif [ "$DISPATCH_LIVE" = "false" ]; then
              LIVE=false
            elif [ "$DRY_RUN" = "false" ]; then
              LIVE=true
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
      - name: Test before running
        run: python -m unittest -q
      - name: Run composer or responder
        env:
          RUN_MODE: ${{ steps.settings.outputs.mode }}
          RUN_LIVE: ${{ steps.settings.outputs.live }}
        run: |
          if [ "$RUN_LIVE" = "true" ]; then
            python thread_life_bot.py --mode "$RUN_MODE" --live
          else
            python thread_life_bot.py --mode "$RUN_MODE" --dry-run
          fi
      - name: Persist activity, metrics and daily model quota
        if: ${{ always() && steps.settings.outputs.live == 'true' }}
        run: |
          git config user.name "threads-life-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/history.json ]; then git add data/history.json; fi
          if [ -f data/metrics.json ]; then git add data/metrics.json; fi
          if [ -f data/quota.json ]; then git add data/quota.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record Threads v3.2 activity, insights, and model quota"
          git push
      - name: Save preview and decision audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-run-${{ github.run_id }}
          path: data/last_run.json
          if-no-files-found: ignore
          retention-days: 14
