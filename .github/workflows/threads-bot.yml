name: Threads life bot

on:
  schedule:
    # Nominal Vietnam time; GitHub may delay scheduled runs.
    - cron: "45 4 * * *"   # 11:45 Asia/Ho_Chi_Minh
    - cron: "0 13 * * *"   # 20:00 Asia/Ho_Chi_Minh
    - cron: "30 13 * * *"  # 20:30 reply scan + optional insights
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: "post"
        type: choice
        options: [post, reply, insights]
      live:
        description: "Publish live; false always forces a preview"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: threads-life-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      ENABLE_REPLIES: ${{ vars.ENABLE_REPLIES || 'false' }}
      REPLY_DAILY_CAP: ${{ vars.REPLY_DAILY_CAP || '3' }}
      TOPIC_SEED: ${{ vars.TOPIC_SEED || '' }}
      TREND_HINT: ${{ vars.TREND_HINT || '' }}
      ENABLE_TREND_FEED: ${{ vars.ENABLE_TREND_FEED || 'true' }}
      TREND_RSS_URL: ${{ vars.TREND_RSS_URL || 'https://trends.google.com/trending/rss?geo=VN' }}
      ENABLE_THREADS_TRENDS: ${{ vars.ENABLE_THREADS_TRENDS || 'false' }}
      ENABLE_INSIGHTS: ${{ vars.ENABLE_INSIGHTS || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Choose mode and force preview for manual live=false
        id: settings
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LIVE: ${{ inputs.live }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE=post
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
            if [ "$INPUT_LIVE" = "true" ]; then LIVE=true; else LIVE=false; fi
          else
            if [ "$SCHEDULE" = "30 13 * * *" ]; then MODE=reply; fi
            if [ "$DRY_RUN" = "false" ]; then LIVE=true; else LIVE=false; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
      - name: Test before running
        run: python -m unittest -q
      - name: Run composer or responder
        env:
          RUN_MODE: ${{ steps.settings.outputs.mode }}
          RUN_LIVE: ${{ steps.settings.outputs.live }}
        run: |
          if [ "$RUN_LIVE" = "true" ]; then
            python thread_life_bot.py --mode "$RUN_MODE" --live
          else
            python thread_life_bot.py --mode "$RUN_MODE" --dry-run
          fi
      - name: Persist published activity and optional insights
        if: ${{ always() && steps.settings.outputs.live == 'true' }}
        run: |
          git config user.name "threads-life-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if [ -f data/metrics.json ]; then git add data/metrics.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record Threads activity and observed insights"
          git push
      - name: Save preview and decision audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-run-${{ github.run_id }}
          path: data/last_run.json
          if-no-files-found: ignore
          retention-days: 14

